server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # Shared proxy policy, inherited by both API locations below.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite untrusted client input so the API can safely use the first XFF IP.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket support (for future use)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Only the file upload endpoint needs the larger, bounded multipart budget.
    location = /api/datasets/upload {
        client_max_body_size ${WEB_MAX_BODY_SIZE};
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_pass http://${API_HOST}:${API_PORT}/api/datasets/upload;
    }

    location /api/ {
        client_max_body_size 1m;
        proxy_pass http://${API_HOST}:${API_PORT}/api/;
    }

    # Static files caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
